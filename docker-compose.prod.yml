services:

  api:
    image: sanedoma/todo-api:a3a2e01f5cf76cd6a248b873ac3d9ef48eab8f01
    container_name: todo-api-prod

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3000:3000"

    depends_on:
      - postgres


  postgres:
    image: postgres:16
    container_name: todo-db-prod

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data


  prometheus:
    image: prom/prometheus

    container_name: todo-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - api
  
  grafana:
    image: grafana/grafana

    container_name: todo-grafana

    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana_data:/var/lib/grafana


volumes:
  postgres_data:
  grafana_data: