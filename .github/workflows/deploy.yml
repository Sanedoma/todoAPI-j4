name: Deploy Todo API

on:
  push:
    branches:
      - main

permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/todo-api:${{ github.sha }} .


      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/todo-api:${{ github.sha }}


      - name: Deploy Kubernetes
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            kubectl set image deployment/todo-api \
            todo-api=${{ secrets.DOCKER_USERNAME }}/todo-api:${{ github.sha }} \
            -n todo


            kubectl rollout status deployment/todo-api \
            -n todo