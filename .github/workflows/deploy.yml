name: Deploy Todo API


on:
  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  deploy:

    runs-on: ubuntu-latest


    steps:

      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |

            docker pull ${{ secrets.DOCKER_USERNAME }}/todo-api:${{ github.sha }}


            docker stop todo-api || true


            docker rm todo-api || true


            docker run -d \
              --name todo-api \
              -p 3000:3000 \
              ${{ secrets.DOCKER_USERNAME }}/todo-api:${{ github.sha }}